<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint (same rules as src/lib/theme.ts): default
      // dark; "system" follows the OS with a dark fallback; storage may be unavailable.
      (function () {
        var pref = "dark";
        try {
          var saved = localStorage.getItem("hl-theme");
          if (saved === "dark" || saved === "light" || saved === "system") pref = saved;
        } catch (e) {}
        var theme = pref;
        if (pref === "system") {
          try {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          } catch (e) {
            theme = "dark";
          }
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
